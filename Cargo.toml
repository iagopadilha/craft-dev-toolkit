[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Iago Boardman Padilha"]
repository = "https://github.com/iagopadilha/craft-dev-toolkit"
rust-version = "1.82"

[workspace.dependencies]
regex = "1"
fancy-regex = "0.14"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Style lints that would reshape code written to mirror the reference line by line (the differential tests are the safety net).
needless_range_loop = "allow"
if_same_then_else = "allow"
manual_strip = "allow"
unnecessary_to_owned = "allow"
bool_assert_comparison = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
result_large_err = "allow"
result_unit_err = "allow"
items_after_test_module = "allow"
doc_overindented_list_items = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
